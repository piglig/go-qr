name: Go

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ "oldstable", "stable" ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.mod
            tools/go.sum
            mcp/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      # tools/go.mod and mcp/go.mod pin the released library so `go install`
      # works; the workspace makes CI build and test them against this
      # checkout.
      - name: Use workspace
        run: go work init . ./tools ./demo ./mcp

      - name: Vet
        run: |
          go vet ./...
          (cd tools && go vet ./...)
          (cd demo && go vet ./... && GOOS=js GOARCH=wasm go vet ./...)
          (cd mcp && go vet ./...)

      - name: Test
        run: |
          go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
          (cd tools && go test -race ./...)
          (cd demo && go test ./... && GOOS=js GOARCH=wasm go build -o /dev/null .)
          (cd mcp && go test -race ./...)

      - name: Fuzz smoke test
        run: |
          for target in FuzzEncode FuzzEncodeStructured FuzzRender FuzzDecodeRoundTrip FuzzDecodeNoPanic FuzzDecodeAllRoundTrip FuzzDecodeAllNoPanic FuzzGrade; do
            go test -run='^$' -fuzz="^$target\$" -fuzztime=15s .
          done
          go test -run='^$' -fuzz='^FuzzMaskPenalty$' -fuzztime=15s ./internal/symbol
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=15s ./payload
          go test -run='^$' -fuzz='^FuzzStringParse$' -fuzztime=15s ./payload
          go test -run='^$' -fuzz='^FuzzCorrectErasures$' -fuzztime=15s ./internal/reedsolomon

      # Staticcheck releases trail Go's: v0.8.1 cannot read the export data
      # of Go 1.27.2. Run it on oldstable, which it always supports.
      - name: Staticcheck
        if: matrix.go == 'oldstable'
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Upload coverage reports to Codecov
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  minimum-go:
    name: test (go.mod minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  # The test job builds tools and mcp against this checkout. This one builds
  # them as `go install ...@latest` does, against the library release their
  # go.mod pins, so a change there that needs unreleased library code fails
  # here until the library is released and the pin bumped.
  released-library:
    name: test (tools and mcp on the pinned library)
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            tools/go.sum
            mcp/go.sum
      - name: Test
        run: |
          for m in tools mcp; do
            (cd $m && go mod verify && go vet ./... && go test ./...)
          done

  # The release workflow builds these archives when it releases tools or
  # mcp; build them here too, so that a change that breaks a platform or the
  # script fails before a release.
  binaries:
    name: release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            tools/go.sum
            mcp/go.sum
      - name: Build
        run: |
          scripts/build-binaries.sh tools 0.0.0 "$RUNNER_TEMP/dist"
          scripts/build-binaries.sh mcp 0.0.0 "$RUNNER_TEMP/dist"
      - name: Check the binaries
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -c generator_0.0.0_checksums.txt go-qr-mcp_0.0.0_checksums.txt
          tar -xzf generator_0.0.0_linux_amd64.tar.gz
          tar -xzf go-qr-mcp_0.0.0_linux_amd64.tar.gz
          test "$(generator_0.0.0_linux_amd64/generator version)" = v0.0.0
          test "$(go-qr-mcp_0.0.0_linux_amd64/go-qr-mcp -version)" = v0.0.0
          generator_0.0.0_linux_amd64/generator encode -png qr.png hello
          test "$(generator_0.0.0_linux_amd64/generator decode qr.png)" = hello

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go work init . ./tools ./demo ./mcp
      - run: govulncheck ./...
      - run: cd tools && govulncheck ./...
      - run: cd mcp && govulncheck ./...
