name: Go

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ "oldstable", "stable" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.mod
            tools/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      # tools/go.mod pins the released library so `go install` works; the
      # workspace makes CI build and test the tools against this checkout.
      - name: Use workspace
        run: go work init . ./tools

      - name: Vet
        run: |
          go vet ./...
          (cd tools && go vet ./...)

      - name: Test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          (cd tools && go test -race ./...)

      - name: Fuzz smoke test
        run: go test -run='^$' -fuzz='^FuzzDecodeNoPanic$' -fuzztime=30s .

      - name: Staticcheck
        if: matrix.go == 'stable'
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Upload coverage reports to Codecov
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  minimum-go:
    name: test (go.mod minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go work init . ./tools
      - run: govulncheck ./...
      - run: cd tools && govulncheck ./...
